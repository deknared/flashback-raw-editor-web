<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0d0d0d" rx="112"/>

  <!-- Film frame border -->
  <rect x="56" y="80" width="400" height="352" fill="none" stroke="#ed7c39" stroke-width="18" rx="24"/>

  <!-- Sprocket holes — top row -->
  <rect x="96"  y="48" width="36" height="26" fill="#ed7c39" rx="6"/>
  <rect x="188" y="48" width="36" height="26" fill="#ed7c39" rx="6"/>
  <rect x="288" y="48" width="36" height="26" fill="#ed7c39" rx="6"/>
  <rect x="380" y="48" width="36" height="26" fill="#ed7c39" rx="6"/>

  <!-- Sprocket holes — bottom row -->
  <rect x="96"  y="438" width="36" height="26" fill="#ed7c39" rx="6"/>
  <rect x="188" y="438" width="36" height="26" fill="#ed7c39" rx="6"/>
  <rect x="288" y="438" width="36" height="26" fill="#ed7c39" rx="6"/>
  <rect x="380" y="438" width="36" height="26" fill="#ed7c39" rx="6"/>

  <!-- Lens outer ring -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#ed7c39" stroke-width="14"/>

  <!-- Lens inner circle -->
  <circle cx="256" cy="256" r="68" fill="#ed7c39" opacity="0.18"/>
  <circle cx="256" cy="256" r="50" fill="#ed7c39" opacity="0.28"/>

  <!-- Lens glint -->
  <circle cx="228" cy="228" r="14" fill="white" opacity="0.12"/>
</svg>
